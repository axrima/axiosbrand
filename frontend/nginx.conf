server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 500m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Never let probes for secrets/configuration fall through to the SPA.
    # The SPA fallback returns index.html with 200 for otherwise unknown paths,
    # which makes scanner requests such as /env look like real resources.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # Hidden files/directories (.env, .git, .aws, etc.). Keep ACME and other
    # standards-based files under /.well-known/ available via the rule above.
    location ~ (^|/)\. {
        access_log off;
        log_not_found off;
        return 404;
    }

    # Common secret, configuration, backup and diagnostics probes.
    location ~* ^/(env|config|configuration|secrets?|credentials?|phpinfo|server-status)(/|\.|$) {
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* (^|/)(docker-compose(?:\.[^/]*)?\.ya?ml|dockerfile|wp-config\.php|web\.config|application\.ya?ml|package(?:-lock)?\.json|composer\.(?:json|lock)|yarn\.lock|pnpm-lock\.yaml|id_(?:rsa|dsa|ecdsa|ed25519))(?:$|/) {
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* \.(?:bak|backup|conf|config|ini|log|old|orig|pem|sql|sqlite|swp|ya?ml)(?:\.[^/]*)?$ {
        access_log off;
        log_not_found off;
        return 404;
    }

    # Media streaming: long reads, no buffering (videos + large images via backend→S3)
    location ^~ /api/media/ {
        proxy_pass http://backend:3000/api/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # API proxy must win over static extension matching (/api/media/*.jpg)
    location ^~ /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Static assets with cache (SPA build output only)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Site icons from backend (Safari/Yandex request /favicon.ico directly)
    location = /favicon.ico {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /favicon.svg {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /apple-touch-icon.png {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # SEO files generated by backend
    location ~ ^/(sitemap(-[a-z]+(-[0-9]+)?)?\.xml|robots\.txt)$ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
